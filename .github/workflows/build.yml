name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tardquest-windows-standalone
            path: |
              src-tauri/target/x86_64-pc-windows-msvc/release/tardquest.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: tardquest-linux
            path: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file patchelf

      # Windows: self-contained standalone executable (no installer). cargo build
      # runs the tauri build script, which embeds the frontend + game.
      - name: Build Windows standalone executable
        if: startsWith(matrix.platform, 'windows')
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}

      # Linux: bundle the AppImage + deb. Needs the Tauri CLI.
      - name: Install Tauri CLI
        if: startsWith(matrix.platform, 'ubuntu')
        working-directory: src-tauri
        run: cargo install tauri-cli --locked

      - name: Build Linux bundles (AppImage + deb)
        if: startsWith(matrix.platform, 'ubuntu')
        working-directory: src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage,deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  # Publish the cross-platform artifacts to a GitHub Release when a tag is pushed.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "TardQuest ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
