name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tardquest-windows-standalone
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: tardquest-linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file patchelf

      # Windows: build a self-contained standalone executable (no installer).
      # `cargo build` runs the tauri build script which embeds the frontend +
      # game, so the produced .exe is the complete, single-file app.
      - name: Build Windows standalone executable
        if: startsWith(matrix.platform, 'windows')
        run: cargo build --release --target ${{ matrix.target }}

      # Linux: bundle the AppImage + .deb. Needs the Tauri CLI.
      - name: Install Tauri CLI
        if: startsWith(matrix.platform, 'ubuntu')
        run: cargo install tauri-cli --locked

      - name: Build Linux bundles (AppImage + deb)
        if: startsWith(matrix.platform, 'ubuntu')
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage,deb

      - name: Upload Windows standalone executable
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/tardquest.exe
          if-no-files-found: error

      - name: Upload Linux bundles
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
