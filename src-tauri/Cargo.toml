[package]
name = "tardquest"
version = "1.20.1"
description = "Tauri v2 desktop wrapper for TardQuest"
authors = ["VocaPepper"]
license = "ISC"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
