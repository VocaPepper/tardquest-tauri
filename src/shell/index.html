<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TARDQUEST Online II: A Realm Unborn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!----------------------------------------- Titlebar ------------------------------------->

    <div class="custom-titlebar">
        <img class="custom-titlebar-logo" src="titlebar/logo.png">
        <div class="custom-titlebar-name"><i>TARDQUEST Online II: A Realm Unborn</i></div>
        <div class="window-controls">
            <button class="window-control minimize" onclick="window.tauriAPI.minimizeWindow()"></button>
            <button class="window-control fullscreen" onclick="window.tauriAPI.toggleFullscreen()"></button>
            <button class="window-control maximize" onclick="window.tauriAPI.maximizeWindow()"></button>
            <button class="window-control close" onclick="window.tauriAPI.closeWindow()"></button>
        </div>
    </div>

<!----------------------------------------- Toolbar ------------------------------------

    <div class="toolbar-strip">
        <div class="border-selector">
            <select class="border-dropdown" id="borderSelect" onchange="changeBorder()">
                <option value="" disabled selected>Border Art</option>
                <option value="">None</option>
                <option value="characters.png">Characters</option>
                <option value="erok.png">Erok</option>
                <option value="tile1.gif">tile1</option>
            </select>
        </div>
        <div class="filter-selector">
            <select class="filter-dropdown" id="filterSelect" onchange="toggleRetroFilter()">
                <option value="" disabled selected>Retro Filter</option>
                <option value="off">Off</option>
                <option value="on">Scanlines Only</option>
                <option value="both">Scanlines + Dithering</option>
            </select>
        </div>
        <div class="online-selector">
            <select class="online-dropdown" id="onlineSelect">
                <option value="" disabled selected>Online</option>
                <option value="tardboard">TardBoard</option>
            </select>
        </div>
        <div class="dev-selector">
            <select class="dev-dropdown" id="devSelect">
                <option value="" disabled selected>Dev</option>
                <option value="tardtest">TardTest</option>
                <option value="apitest">APITest</option>
            </select>
        </div>
    </div>
-->

<!----------------------------------------- Body --------------------------------------->

    <div class="main-content">
        <iframe src="../game/game.html" frameborder="0" id="gameFrame"></iframe>
    </div>
    <div class="crt-filter" id="crtFilter">
        <div class="dither-overlay" id="ditherOverlay"></div>
    </div>

<!----------------------------------- Draggable Windows --------------------------------->

    <div id="leaderboardWindow" class="draggable-window" style="display:none;">
        <div class="draggable-titlebar" id="leaderboardTitlebar">
            <span class="draggable-title">TardBoard</span>
            <button class="window-control close" id="closeLeaderboardBtn" title="Close"></button>
        </div>
        <div class="draggable-content" id="leaderboardContent"></div>
    </div>
    <div id="tardtestWindow" class="draggable-window" style="display:none;">
        <div class="draggable-titlebar" id="tardtestTitlebar">
            <span class="draggable-title">TardTest</span>
            <button class="window-control close" id="closeTardtestBtn" title="Close"></button>
        </div>
        <div class="draggable-content" id="tardtestContent"></div>
    </div>
    <div id="apitestWindow" class="draggable-window" style="display:none;">
        <div class="draggable-titlebar" id="apitestTitlebar">
            <span class="draggable-title">APITest</span>
            <button class="window-control close" id="closeApitestBtn" title="Close"></button>
        </div>
        <div class="draggable-content" id="apitestContent"></div>
    </div>
    
<!----------------------------------- Password Modal --------------------------------->

    <div id="passwordModal" class="password-modal" style="display:none;">
        <div class="password-modal-content">
            <h2>You must be a developer to access these tools.</h2>
            <input type="password" id="passwordInput" placeholder="Enter Developer Password">
            <div class="password-modal-buttons">
                <button id="passwordSubmit">OK</button>
                <button id="passwordCancel">Cancel</button>
            </div>
        </div>
    </div>
    
<!------------------------------------- Scripts --------------------------------------->

    <script type="module">
        import { getCurrentWindow } from '../lib/tauri-api/window.js';
        const win = getCurrentWindow();
        window.tauriAPI = {
            minimizeWindow: () => win.minimize(),
            maximizeWindow: () => win.toggleMaximize(),
            closeWindow: () => win.close(),
            async toggleFullscreen() {
                const full = await win.isFullscreen();
                await win.setFullscreen(!full);
            },
            onFullscreenChange(callback) {
                win.onFullscreenChanged(({ payload: isFullscreen }) => {
                    callback(null, isFullscreen);
                });
            }
        };
    </script>
    <script src="scripts/titlebar.js"></script>
    <script src="scripts/windowfocus.js"></script>
</body>
</html>
