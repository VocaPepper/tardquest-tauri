<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TARDQUEST</title>
    <script>
        // Fallback entry: send desktop clients straight to the shell.
        var currentPath = window.location.pathname || "";
        var isSubPage = currentPath.indexOf("/shell/") !== -1 || currentPath.indexOf("/game/") !== -1;
        if (!isSubPage) {
            window.location.replace("shell/index.html");
        }
    </script>
</head>
